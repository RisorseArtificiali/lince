[project]
name = "telebridge"
version = "0.1.0"
description = "Telegram bridge for Claude Code"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[rate-limiter]>=21.0",
    "aiofiles>=24.0.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "telegramify-markdown>=0.5.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.1.0"]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
telebridge = "telebridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telebridge"]
